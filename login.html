<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login - Ferramentas</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,Helvetica,sans-serif;
}

:root{
    --pink:#ff2ea6;
    --purple:#8b5cf6;
    --blue:#00e5ff;
    --text:#ffffff;
    --text2:#b9c7e4;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    position:relative;

    background:
        radial-gradient(circle at top left,rgba(255,46,166,.18),transparent 30%),
        radial-gradient(circle at bottom right,rgba(0,229,255,.18),transparent 35%),
        linear-gradient(135deg,#04070d,#0d1425,#181f37,#04070d);
}

/* Fundo Neon */

body::before{
    content:"";
    position:fixed;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 80px,
            rgba(0,229,255,.04) 81px
        ),
        repeating-linear-gradient(
            0deg,
            transparent 0,
            transparent 80px,
            rgba(255,46,166,.04) 81px
        );

    pointer-events:none;
}

body::after{
    content:"";
    position:fixed;

    width:700px;
    height:700px;

    border-radius:50%;

    background:
        radial-gradient(circle,
        rgba(255,46,166,.20),
        transparent 70%);

    top:-220px;
    right:-180px;

    filter:blur(45px);

    pointer-events:none;
}

/* LOGIN */

.container{

    position:relative;

    z-index:10;

    width:390px;

    padding:40px;

    border-radius:24px;

    background:
        rgba(18,22,35,.78);

    backdrop-filter:blur(18px);

    border:1px solid rgba(255,255,255,.08);

    box-shadow:
        0 20px 50px rgba(0,0,0,.55),
        0 0 35px rgba(255,46,166,.12);

    text-align:center;

    overflow:hidden;
}

/* Barra Neon */

.container::before{

    content:"";

    position:absolute;

    left:0;
    top:0;

    width:100%;
    height:3px;

    background:
        linear-gradient(90deg,
        var(--pink),
        var(--blue),
        var(--purple));

    box-shadow:0 0 15px var(--blue);

    pointer-events:none;

}

/* IMPORTANTE */

.container>*{
    position:relative;
    z-index:2;
}

h2{

    color:white;

    font-size:32px;

    margin-bottom:8px;

    text-shadow:
        0 0 10px var(--pink),
        0 0 20px var(--purple);

}

.info{

    color:var(--text2);

    margin-bottom:28px;

    font-size:14px;

}

input{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    border-radius:12px;

    border:1px solid rgba(255,255,255,.10);

    background:rgba(255,255,255,.05);

    color:white;

    font-size:15px;

    transition:.25s;

}

input::placeholder{

    color:#91a3c4;

}

input:focus{

    outline:none;

    border-color:var(--blue);

    box-shadow:
        0 0 15px rgba(0,229,255,.35);

}

button{

    width:100%;

    padding:14px;

    border:none;

    border-radius:12px;

    cursor:pointer;

    font-size:16px;

    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            135deg,
            var(--pink),
            var(--purple));

    transition:.3s;

    box-shadow:
        0 0 18px rgba(255,46,166,.35);

}

button:hover{

    transform:translateY(-3px);

    box-shadow:
        0 0 20px var(--pink),
        0 0 40px var(--purple);

}

.footer{

    margin-top:25px;

    color:#8093b6;

    font-size:12px;

}

@media(max-width:500px){

.container{

width:92%;

padding:30px;

}

h2{

font-size:28px;

}

}
</style>

</head>

<body>

<div class="container">

<h2>Login</h2>

<p class="info">
Use o mesmo login utilizado para solicitar veículos!.
</p>

<form id="formLogin">

<input type="email" id="email" placeholder="Digite seu email">

<input type="password" id="senha" placeholder="Digite sua senha">

<button id="btnLogin">Entrar</button>

</form>

<div class="footer">
Sistema de Ferramentas
</div>

</div>

<script type="module" src="auth.js"></script>

</body>
</html>
