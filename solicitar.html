<title>Equipamentos</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  padding:30px;
  background:
    radial-gradient(circle at top right, rgba(255,193,7,.15), transparent 250px),
    radial-gradient(circle at bottom left, rgba(255,193,7,.08), transparent 250px),
    linear-gradient(135deg,#0f172a,#1e293b);
}

/* TÍTULO */

h2{
  text-align:center;
  color:#fff;
  margin-bottom:35px;
  font-size:30px;
  font-weight:700;
  letter-spacing:.5px;
}

/* Linha decorativa estilo São João */

h2::after{
  content:"✦ ✦ ✦";
  display:block;
  margin-top:8px;
  color:#fbbf24;
  font-size:14px;
  letter-spacing:8px;
}

/* GRID */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:22px;
}

/* CARD */

.card{
  background:#ffffff;
  border-radius:18px;
  padding:15px;
  text-align:center;
  box-shadow:
    0 10px 30px rgba(0,0,0,.18);
  transition:.25s ease;
  border:1px solid rgba(255,193,7,.15);
}

.card:hover{
  transform:translateY(-6px);
  box-shadow:
    0 18px 35px rgba(0,0,0,.25);
}

/* IMAGEM */

.card img{
  width:100%;
  height:140px;
  object-fit:cover;
  border-radius:12px;
}

/* NOME */

.nome{
  margin:14px 0;
  font-weight:700;
  color:#1e293b;
  font-size:16px;
}

/* BOTÕES */

.botoes{
  display:flex;
  gap:8px;
}

button{
  flex:1;
  padding:10px;
  border:none;
  border-radius:10px;
  color:white;
  cursor:pointer;
  transition:.2s;
  font-weight:600;
}

/* SOLICITAR */

.solicitar{
  background:#2563eb;
}

.solicitar:hover{
  background:#1d4ed8;
}

/* DEVOLVER */

.devolver{
  background:#16a34a;
}

.devolver:hover{
  background:#15803d;
}

/* STATUS */

.status{
  margin:10px 0;
  font-size:14px;
  font-weight:700;
}

.disponivel{
  color:#16a34a;
}

.em-uso{
  color:#dc2626;
}

/* RESPONSIVO */

@media(max-width:768px){

  body{
    padding:20px;
  }

  h2{
    font-size:24px;
  }

}

.voltar {
    position: fixed;
    top: 20px;
    right: 20px;
    z-index: 1000;

    display: inline-flex;
    align-items: center;
    justify-content: center;
    padding: 12px 24px;
    color: #fff;
    text-decoration: none;
    font-weight: 700;
    border-radius: 140px;
    background: var(--grad);
    box-shadow: 0 0 15px rgb(253, 4, 4);
    transition: .3s;
    animation: fade .7s ease;
}

.voltar:hover {
    transform: translateY(-4px);
    box-shadow: 0 0 40px rgba(255, 60, 172, .7);
}

</style>



</head>
