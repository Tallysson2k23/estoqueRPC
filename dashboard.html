<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: "Segoe UI", Arial, Helvetica, sans-serif;
}

:root{
  --bg:#070b14;
  --bg2:#0f172a;
  --pink:#ff2ea6;
  --purple:#8b5cf6;
  --blue:#00e5ff;
  --white:#ffffff;
  --text:#dce7ff;
  --glass:rgba(18,22,35,.72);
  --border:rgba(255,255,255,.12);
}

body{
  min-height:100vh;
  background:
  radial-gradient(circle at top left,#ff2ea633 0%,transparent 30%),
  radial-gradient(circle at bottom right,#00e5ff22 0%,transparent 35%),
  linear-gradient(135deg,#05070d,#0d1324,#161b33,#090d18);
  color:var(--white);
  position:relative;
  overflow-x:hidden;
}

/* Fundo Neon */

body::before{
  content:"";
  position:fixed;
  inset:0;
  pointer-events:none;
  background:
  repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 79px,
      rgba(0,229,255,.05) 80px
  ),
  repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 79px,
      rgba(255,46,166,.05) 80px
  );
  z-index:0;
}

body::after{
  content:"";
  position:fixed;
  width:650px;
  height:650px;
  border-radius:50%;
  background:radial-gradient(circle,
  rgba(255,46,166,.25),
  transparent 70%);
  top:-220px;
  right:-150px;
  filter:blur(40px);
  pointer-events:none;
  z-index:0;
}

/* HEADER */

.header{
  position:relative;
  z-index:2;

  display:flex;
  justify-content:space-between;
  align-items:center;

  padding:22px 30px;

  background:var(--glass);
  backdrop-filter:blur(18px);

  border-bottom:1px solid rgba(255,255,255,.08);

  box-shadow:
  0 0 40px rgba(0,0,0,.35),
  inset 0 0 25px rgba(255,255,255,.02);
}

.header h2{
  color:white;
  font-size:26px;
  letter-spacing:1px;
  text-transform:uppercase;
  text-shadow:
  0 0 12px var(--pink),
  0 0 25px var(--purple);
}

/* BOTÃO SAIR */

.logout{
  padding:12px 22px;
  border:none;
  border-radius:12px;
  cursor:pointer;
  font-weight:700;
  color:white;

  background:linear-gradient(
  135deg,
  var(--pink),
  var(--purple));

  box-shadow:
  0 0 18px rgba(255,46,166,.45);

  transition:.3s;
}

.logout:hover{

  transform:translateY(-4px);

  box-shadow:
  0 0 15px var(--pink),
  0 0 35px var(--purple),
  0 10px 25px rgba(0,0,0,.35);

}

/* ALERTA */

.alerta{

  width:90%;
  max-width:900px;

  margin:25px auto;

  padding:18px;

  display:none;

  border-radius:14px;

  background:
  linear-gradient(
  135deg,
  rgba(255,46,166,.20),
  rgba(0,229,255,.20));

  border:1px solid rgba(255,255,255,.15);

  color:white;

  font-weight:bold;

  text-align:center;

  backdrop-filter:blur(12px);

  box-shadow:
  0 0 30px rgba(255,46,166,.18);

  position:relative;
  z-index:2;

}

/* CONTAINER */

.container{

  position:relative;
  z-index:2;

  display:flex;
  justify-content:center;

  padding:60px 40px;

}

/* GRID */

.cards{

  width:900px;

  display:grid;

  grid-template-columns:
  repeat(auto-fit,minmax(250px,1fr));

  gap:28px;

}

/* CARDS */

.card{

  position:relative;

  overflow:hidden;

  padding:35px;

  border-radius:22px;

  text-align:center;

  text-decoration:none;

  color:white;

  background:

  linear-gradient(
  180deg,
  rgba(255,255,255,.08),
  rgba(255,255,255,.03));

  backdrop-filter:blur(16px);

  border:1px solid rgba(255,255,255,.08);

  transition:.35s;

  box-shadow:
  0 12px 30px rgba(0,0,0,.45);

}

/* brilho */

.card::before{

  content:"";

  position:absolute;

  top:-120%;

  left:-50%;

  width:60%;

  height:320%;

  background:
  linear-gradient(
  transparent,
  rgba(255,255,255,.35),
  transparent);

  transform:rotate(25deg);

  transition:.8s;

}

.card:hover::before{

  left:130%;

}

.card:hover{

  transform:
  translateY(-10px)
  scale(1.03);

  border-color:var(--blue);

  box-shadow:

  0 0 15px rgba(0,229,255,.35),

  0 0 30px rgba(255,46,166,.20),

  0 18px 35px rgba(0,0,0,.55);

}

/* MAIS UTILIZADOS */

.card:nth-child(1),
.card:nth-child(2),
.card:nth-child(3){

  border:2px solid rgba(0,229,255,.45);

  box-shadow:

  0 0 18px rgba(0,229,255,.25),

  0 15px 35px rgba(0,0,0,.45);

}

.card:nth-child(1):hover,
.card:nth-child(2):hover,
.card:nth-child(3):hover{

  box-shadow:

  0 0 25px var(--blue),

  0 0 50px rgba(255,46,166,.35),

  0 20px 40px rgba(0,0,0,.55);

}

/* ÍCONES */

.icon{

  font-size:52px;

  margin-bottom:15px;

  text-shadow:

  0 0 10px var(--blue),

  0 0 20px var(--pink);

}

/* TÍTULO */

.card h3{

  font-size:22px;

  margin-bottom:10px;

  letter-spacing:.5px;

}

/* TEXTO */

.card p{

  color:#b8c8e8;

  line-height:1.5;

}

/* RESPONSIVO */

@media(max-width:768px){

.container{

padding:30px 20px;

}

.header{

padding:18px;

}

.header h2{

font-size:20px;

}

.cards{

width:100%;

}

.card{

padding:28px;

}

.icon{

font-size:46px;

}

}
</style>


</head>

<body>

<div class="header">
  <h2>Sistema de Solicitação de Ferramentas</h2>
  <button class="logout" onclick="logout()">Sair</button>
</div>

<!-- 🔥 ALERTA -->
<div id="alerta" class="alerta"></div>

<div class="container">
  <div class="cards">

    <a class="card" href="solicitar.html">
      <div class="icon">🕳</div>
      <h3>Solicitar / Devolver</h3>
      <p>Gerenciar equipamentos</p>
    </a>

    <a class="card" href="controle.html">
      <div class="icon">🎮</div>
      <h3>Controle</h3>
      <p>Visualizar registros</p>
    </a>
<!--
        <a class="card" href="nova pagina aqui">
      <div class="icon">...</div>
      <h3>Nova função</h3>
      <p>Em breve</p>
    </a> -->

  </div>
</div>

<script type="module">

import { auth, db } from "./firebase-config.js";

import { 
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// logout
window.logout = function() {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};

// 🔥 VERIFICA EQUIPAMENTOS DO USUÁRIO
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  try {

    const q = query(
      collection(db, "solicitacoes_ferramentas"),
      where("uid", "==", user.uid),
      where("status", "==", "em_uso") // 🔥 CORRETO
    );

    const snapshot = await getDocs(q);

    const alerta = document.getElementById("alerta");

    if (!snapshot.empty) {

      let equipamentos = new Set();

      snapshot.forEach(doc => {
        const dados = doc.data();
        equipamentos.add(dados.equipamento);
      });

      alerta.style.display = "block";
      alerta.innerText =
        "⚠️ Você está com os seguintes equipamentos: " +
        [...equipamentos].join(", ");

    } else {

      alerta.style.display = "none";

    }

  } catch (error) {
    console.error("Erro ao buscar dados:", error);
  }

});

</script>

</body>
</html>
