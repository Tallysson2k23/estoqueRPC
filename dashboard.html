<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family: Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background: linear-gradient(135deg,#8e2c16,#c65d1e,#f39c12);
  position:relative;
  overflow-x:hidden;
}

/* Bandeirinhas São João */
body::before{
  content:"";
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:90px;
  pointer-events:none;
  z-index:0;
  background-image:
  repeating-linear-gradient(
    -45deg,
    #e74c3c 0 20px,
    #f1c40f 20px 40px,
    #3498db 40px 60px,
    #2ecc71 60px 80px
  );
  clip-path:polygon(
    0 0,
    100% 0,
    100% 40%,
    97% 100%,
    94% 40%,
    91% 100%,
    88% 40%,
    85% 100%,
    82% 40%,
    79% 100%,
    76% 40%,
    73% 100%,
    70% 40%,
    67% 100%,
    64% 40%,
    61% 100%,
    58% 40%,
    55% 100%,
    52% 40%,
    49% 100%,
    46% 40%,
    43% 100%,
    40% 40%,
    37% 100%,
    34% 40%,
    31% 100%,
    28% 40%,
    25% 100%,
    22% 40%,
    19% 100%,
    16% 40%,
    13% 100%,
    10% 40%,
    7% 100%,
    4% 40%,
    1% 100%,
    0 40%
  );
}

.header{
  background:rgba(255,255,255,0.95);
  backdrop-filter:blur(8px);
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 5px 20px rgba(0,0,0,0.12);
  position:relative;
  z-index:1;
  border-bottom:3px solid #f39c12;
}

.header h2{
  color:#6d2d13;
  font-weight:700;
}

.logout{
  padding:10px 18px;
  border:none;
  border-radius:8px;
  background:#e74c3c;
  color:white;
  cursor:pointer;
  transition:.25s;
  font-weight:bold;
}

.logout:hover{
  background:#c0392b;
  transform:translateY(-2px);
}

/* 🔥 ALERTA */
.alerta{
  width:90%;
  max-width:900px;
  margin:20px auto;
  background:linear-gradient(135deg,#e67e22,#d35400);
  color:white;
  padding:15px;
  border-radius:12px;
  text-align:center;
  font-weight:bold;
  display:none;
  box-shadow:0 8px 20px rgba(0,0,0,0.15);
  position:relative;
  z-index:1;
}

/* CONTEÚDO */
.container{
  padding:50px 40px 40px;
  display:flex;
  justify-content:center;
  position:relative;
  z-index:1;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
  gap:25px;
  width:700px;
}

.card{
  background:rgba(255,255,255,0.97);
  padding:30px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 12px 30px rgba(0,0,0,0.15);
  transition:.25s;
  text-decoration:none;
  color:#333;
  border:2px solid transparent;
}

.card:hover{
  transform:translateY(-6px);
  border-color:#f39c12;
  box-shadow:0 18px 35px rgba(0,0,0,0.2);
}

.icon{
  font-size:42px;
  margin-bottom:10px;
}

/* Detalhe junino sutil */
.card:nth-child(odd){
  border-bottom:4px solid #e74c3c;
}

.card:nth-child(even){
  border-bottom:4px solid #f1c40f;
}

/* Responsivo */
@media(max-width:768px){
  .container{
    padding:40px 20px;
  }

  .header{
    padding:15px;
  }

  .header h2{
    font-size:18px;
  }

  .card{
    padding:25px;
  }
}
</style>


</head>

<body>

<div class="header">
  <h2>Sistema de Solicitação de Ferramentas</h2>
  <button class="logout" onclick="logout()">Sair</button>
</div>

<!-- 🔥 ALERTA -->
<div id="alerta" class="alerta"></div>

<div class="container">
  <div class="cards">

    <a class="card" href="solicitar.html">
      <div class="icon">🔥</div>
      <h3>Solicitar / Devolver</h3>
      <p>Gerenciar equipamentos</p>
    </a>

    <a class="card" href="controle.html">
      <div class="icon">🎇</div>
      <h3>Controle</h3>
      <p>Visualizar registros</p>
    </a>

        <a class="card" href="nova pagina aqui">
      <div class="icon">🕳</div>
      <h3>Nova função</h3>
      <p>Em breve</p>
    </a>

  </div>
</div>

<script type="module">

import { auth, db } from "./firebase-config.js";

import { 
  collection,
  query,
  where,
  getDocs
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

import { onAuthStateChanged, signOut } 
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

// logout
window.logout = function() {
  signOut(auth).then(() => {
    window.location.href = "login.html";
  });
};

// 🔥 VERIFICA EQUIPAMENTOS DO USUÁRIO
onAuthStateChanged(auth, async (user) => {

  if (!user) {
    window.location.href = "login.html";
    return;
  }

  try {

    const q = query(
      collection(db, "solicitacoes_ferramentas"),
      where("uid", "==", user.uid),
      where("status", "==", "em_uso") // 🔥 CORRETO
    );

    const snapshot = await getDocs(q);

    const alerta = document.getElementById("alerta");

    if (!snapshot.empty) {

      let equipamentos = new Set();

      snapshot.forEach(doc => {
        const dados = doc.data();
        equipamentos.add(dados.equipamento);
      });

      alerta.style.display = "block";
      alerta.innerText =
        "⚠️ Você está com os seguintes equipamentos: " +
        [...equipamentos].join(", ");

    } else {

      alerta.style.display = "none";

    }

  } catch (error) {
    console.error("Erro ao buscar dados:", error);
  }

});

</script>

</body>
</html>
