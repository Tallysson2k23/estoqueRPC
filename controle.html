<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">

<title>Controle de Solicitações</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  min-height:100vh;
  background:
    radial-gradient(circle at top right, rgba(255,193,7,.12), transparent 250px),
    radial-gradient(circle at bottom left, rgba(255,193,7,.08), transparent 250px),
    linear-gradient(135deg,#1e3c72,#2a5298);
}

/* HEADER */

.header{
  background:rgba(255,255,255,.97);
  padding:20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 6px 20px rgba(0,0,0,.08);
  border-bottom:3px solid #f4b400;
}

.header h2{
  color:#1e3c72;
}

/* BOTÃO VOLTAR */

.voltar{
  padding:8px 16px;
  background:#2a5298;
  color:white;
  text-decoration:none;
  border-radius:8px;
  transition:.2s;
  font-weight:600;
}

.voltar:hover{
  background:#1e3c72;
  transform:translateY(-1px);
}

/* CONTAINER */

.container{
  padding:40px;
  display:flex;
  justify-content:center;
}

/* CARD */

.card{
  width:1000px;
  background:white;
  padding:30px;
  border-radius:16px;
  box-shadow:0 15px 35px rgba(0,0,0,.15);
  border-top:4px solid #f4b400;
}

/* FILTRO DATA */

.filtro{
  margin-bottom:20px;
  display:flex;
  gap:10px;
  align-items:center;
  flex-wrap:wrap;
}

.filtro label{
  font-weight:600;
  color:#444;
}

input[type="date"]{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #d6d6d6;
  outline:none;
  transition:.2s;
}

input[type="date"]:focus{
  border-color:#f4b400;
  box-shadow:0 0 0 3px rgba(244,180,0,.15);
}

/* TABELA */

table{
  width:100%;
  border-collapse:collapse;
}

thead{
  background:linear-gradient(135deg,#1e3c72,#2a5298);
  color:white;
}

th{
  padding:14px 12px;
  text-align:left;
  font-weight:600;
}

td{
  padding:12px;
}

tbody tr{
  border-bottom:1px solid #e8e8e8;
  transition:.15s;
}

tbody tr:hover{
  background:#faf8f1;
}

/* TEXTAREA */

textarea{
  width:100%;
  min-height:40px;
  resize:none;
  padding:8px;
  border-radius:8px;
  border:1px solid #d8d8d8;
  font-family:Arial, Helvetica, sans-serif;
  font-size:14px;
  overflow:hidden;
  transition:.2s;
}

textarea:focus{
  outline:none;
  border-color:#f4b400;
  box-shadow:0 0 0 3px rgba(244,180,0,.15);
}

/* Detalhe sutil de São João */

.card::before{
  content:"✨";
  display:block;
  margin-bottom:15px;
  color:#d97706;
  font-size:13px;
  font-weight:700;
  letter-spacing:.5px;
}

/* Responsivo */

@media(max-width:768px){

  .container{
    padding:20px;
  }

  .card{
    padding:20px;
  }

  .header{
    padding:15px;
  }

}

</style>
</head>

<body>

<div class="header">
  <h2>Controle de Solicitações</h2>
  <a class="voltar" href="dashboard.html">Voltar</a>
</div>

<div class="container">

<div class="card">

<div class="filtro">
<label>Selecionar data:</label>
<input type="date" id="filtroData">
</div>

<table>
<thead>
<tr>
<th>Usuário</th>
<th>Equipamento</th>
<th>Solicitado em</th>
<th>Devolvido em</th>
<th>Status</th>
<th>Observação</th>
</tr>
</thead>

<tbody id="tabelaSolicitacoes"></tbody>

</table>

</div>

</div>

<script type="module" src="js/controle.js"></script>

</body>
</html>
